# nginx in front of the backend on Render (see entrypoint.sh). It serves the built frontend itself and passes /api to
# the JVM. The instance has a tenth of a CPU, and the JVM stalls for up to seconds at a time (full GCs, JIT compiles,
# a busy request thread): a 400-byte script took 0.2 s to 4 s to arrive from it, so a first visit often waited 2-5 s
# just for the app's files. nginx sends them in microseconds of CPU, whatever the JVM is doing.
# entrypoint.sh replaces __PORT__ (Render's public port) and __BACKEND_PORT__ (the JVM's, internal only).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }
  access_log off;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  # The Docker build gzips the frontend's text files next to them (Render's edge recompresses as it likes).
  gzip_static on;
  gzip_vary on;

  upstream backend {
    server 127.0.0.1:__BACKEND_PORT__;
    keepalive 16;
  }

  server {
    listen __PORT__ default_server;
    root /opt/turbol/static;

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # Pass responses on as they come: the followed flight is a server-sent event stream, and a deploy's nowcast
      # handoff and the 3D volume are large streamed bodies.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      client_max_body_size 50m;
    }

    # Vite fingerprints everything under /assets, so browsers can keep it. A missing file is a 404, so a page from an
    # older build reloads instead of running index.html as a script.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Anything else is a file of the app (sw.js, the manifest, icons) or a deep link the Vue router handles; both are
    # revalidated, since a new build replaces them under the same name.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
