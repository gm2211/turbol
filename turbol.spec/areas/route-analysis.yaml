id: route-analysis
name: Route analysis
prose: >-
  "How bumpy will this flight be": pick an origin and destination (or look up a flight) and get a
  passenger-friendly verdict for the whole flight, gate to gate.
behaviors:
  - id: analyze-airport-pair
    description: >-
      Analyzing an origin and destination returns a great-circle route with a climb, cruise and descent
      profile, sampled in space, altitude and time against the nowcast and forecast.
    details: >-
      Departure defaults to now and cruise altitude to the profile's default; the user can set the
      departure. Aircraft class is never a user input (see aircraft-class-from-flight).
  - id: lookup-flight-by-number
    description: >-
      Looking up a flight number on the Flight tab resolves it against the published timetable for
      the chosen date first (route, scheduled local times, aircraft type, and the days it operates
      when it doesn't fly that date), and only falls back to the first candidate callsign with a
      known route or that is airborne right now, returning its route and live position when
      available.
    details: >-
      Airlines reuse a flight number for every leg of the day, so the live aircraft counts as flying
      the route only when it is near the origin-destination great circle and heading for the
      destination (any heading within 80 km of it). Otherwise it is reported as on another leg and not
      drawn on the route map. The dated timetable comes from FlightStats' flight pages (about three days
      either side of today; beyond that its list of operating days, moved to the chosen date).
      Callsign route databases go stale: DL286 on 2026-10-12 showed NRT to SPN from adsbdb while it
      flies JFK to MXP 16:40 to 06:45 on a 767-300ER (Giulio, "uhm... wat", 2026-10-12, with Turbli
      and turbol screenshots).
  - id: boarding-pass-search
    description: >-
      The analyze page's search is a boarding pass over the cloud backdrop: big FROM and TO airport
      codes that fill in from the looked-up flight or the picked airports, the flight or airport
      inputs and departure below them, and Analyze on a tear-off stub.
    details: >-
      The Flight/Route toggle sits above the pass. With a result on a laptop the pass folds into one
      slim row so the verdict, map and timeline keep the screen; on phones the stub tears off along
      the bottom. On desktop the pages are tabs in the header (no side rail), so every page gets the
      full width.
    source:
      text: boarding pass
      reference: >-
        Giulio, turbol project thread, 2026-10-12, picking design 2 of five alternatives for the
        Analyze page ("propose 5 alternative designs that retain the vibe")
  - id: route-flights-for-day
    description: >-
      On the Route tab, the result lists every flight the route's published timetable has on the
      chosen day (flight number, airline, scheduled departure and arrival in each airport's local
      time with a +1 for next-day arrivals, aircraft type when recently seen), next to an "Any flight"
      option. Picking one analyzes that flight with its real aircraft type from shortly after its gate
      time; the flight departing next from the chosen time is picked by default.
    details: >-
      The timetable comes from FlightStats' public route pages (website data, not a documented API),
      which reach about three days either side of today; further out the same weekday a week earlier
      is used and the strip says so. Codeshare numbers show on hover. Each flight's recent leg (for
      its path and aircraft type) comes from up to 14 days of adsb.lol history, since many flights
      don't operate daily: the flight's callsigns (from the timetable and the route directory,
      Virtual Radar Server standing data) are looked for in the heatmap slot just after its gate time
      on each earlier day, newest first (callsign to airframe), then the airframe's trace, accepting
      an aircraft seen at the gate or taxiing up to two hours before takeoff, trying older sightings when
      the newest is an onward leg under the same callsign or a flight still in the air, and stitching
      legs split across trace files (including across hours-long ocean coverage gaps at cruise). The
      list itself answers from the timetable at once; these searches run in the background and fill
      in on later requests. Callsigns carrying the flight number are tried first, then the
      same airline's callsigns that aren't the number (Emirates' EK206 flies as UAE5RQ), found in
      the slot just after that flight's gate time. When the timetable can't be read the list falls back to flights
      seen flying the route, at their observed takeoff times, and says so. `?pick=` on the URL picks
      a flight by callsign or flight number. Prompted by Giulio asking "why does turbli find more
      flights than turbol" (2026-10-12, project chat), when Turbli listed DL286, AA198, DL184 and
      EK206 at their scheduled times and we listed only AA198 and DL184 at observed takeoff times.
    source:
      text: >-
        should show relevant flights for this route and date and the ability to select each and
        observe turbulence along their planned flight path if available or otherwise look at
        historical flightpaths and extrapolate
      reference: Giulio, turbol project thread, 2026-10-12, on the Analyze page's JFK to MXP result
  - id: flown-track-path
    description: >-
      A path picker beside the flight list shows every path the analysis can follow: Filed plan,
      Average of past flights, the picked flight's last track, and Geodesic. Unavailable ones are
      greyed out with the reason. The best available one is followed by default (in that order), any
      available one can be picked, and the one followed is highlighted in the picker and named on the
      verdict, the timeline and the map legend.
    details: >-
      Filed flight plans aren't public, so Filed plan is always greyed out ("not public"). The
      average needs at least two of the route's tracks from the last 14 days, none straying more
      than 200 km from their mean (positions averaged on the sphere, altitudes and minutes after
      takeoff as plain means, point by point along each track's length); otherwise it says how far
      apart they are. North Atlantic tracks move with the jet stream and often fail this. The last
      track is the flight's own most recent leg on the route, shifted to the chosen departure. Gaps in
      ADS-B coverage over oceans are crossed on the great circle. The average and last track load on
      their own: the analysis starts the route's track searches, waits a bounded time, and marks an
      option still loading (rather than unavailable) while they run, and the page re-analyzes until
      they finish. The average was first asked for as
      "average route based on past flight plans when past flight plans are similar enough to one
      another" (Giulio, 2026-10-12).
    source:
      text: |-
        unclear path is being used: 

        * filed plan
        * average of past flight plans
        * geodesic


        Also I should be able to choose even when all 3 available
      reference: Giulio, turbol project chat, 2026-10-12, on the Analyze page's JFK to MXP result
  - id: route-3d-exploration
    description: >-
      An analysis result has an "Explore in 3D" button that opens the live map's 3D view with the
      analyzed route drawn at its altitudes, each stretch colored by the forecast category where and
      when the flight passes, over a faint curtain to the ground. The view is fitted to the route, set
      to its cruise level band and to the forecast hour nearest its roughest point, and the turbulence
      blocks, level rail, time slider and camera can all be changed from there.
    details: >-
      Hovering the route shows the flight level, time and minutes after takeoff, category, EDR and
      data source at that point. A banner names the route, its departure and the path it follows,
      and its close button hides the route. The route is handed over in local storage with
      `/map?view=3d&route3d=1`, so a reload keeps it.
    source:
      text: >-
        still not seeing flight list nor a way to play around in 3d with turbulence along planned
        route (or average route based on past flight plans when past flight plans are similar enough
        to one another) or geodesic if neither available
      reference: Giulio, turbol project thread, 2026-10-12, on prod's Analyze page for JFK to MXP
  - id: route-map-legend
    description: >-
      The analysis map has a legend explaining the ribbon colours (forecast category), what the line is
      (the average of the route's recent tracks, the flight's flown track and its date, or a great circle), the red ring (worst forecast
      bump with its category and time) and the live aircraft when it is flying this route. Airport
      labels sit on the side away from the route.
  - id: aircraft-class-from-flight
    description: >-
      When analyzing a looked-up flight, the server derives the aircraft class from that flight's live
      ADS-B type and category (aircraft-class-from-adsb), and the result shows the detected type and
      class read-only, with the type's wing loading and how much more or less than an A320 it feels
      turbulence (wing-loading-response), e.g. "Wing loading 684 kg/m² · feels turbulence 19% less
      than an A320".
    details: >-
      When the type is unknown (the flight isn't airborne, or only airports were given) the class is
      assumed from the route length: Heavy (a widebody) from 4,500 km great circle, Medium (a
      narrowbody) below. The result labels it as assumed, a note says so, and no Ride comparison is
      shown, since only a known type's wing loading backs one. The live sighting from the lookup is
      cached for 10 minutes so the analysis doesn't query adsb.lol again. A known type with no
      wing-loading data uses its class's factor and a note says so. Downloaded flights keep the
      response so offline analysis classifies the same way.
  - id: plain-language-verdict
    description: >-
      The result leads with a one-sentence verdict based on the worst en-route category, such as
      "Smooth ride: no significant turbulence expected." or "Some bumps likely, worst around 2h33m
      into the flight."
  - id: near-ground-excluded
    description: >-
      Points below 2,000 ft are shown but excluded from the worst bump, the verdict and the category
      totals.
  - id: timeline-and-breakdown
    description: >-
      The result shows a timeline of category segments, minutes and percentage per category, the
      worst point's time and location, and a map and altitude profile coloured by category.
  - id: verdict-pass-tabs
    description: >-
      The forecast verdict is a boarding pass: a stub with the worst category's code (MOD) and when it
      comes (5h54, or the flight time when smooth) like FROM and TO, the verdict sentence, a
      perforation, then tabs (Summary, Bumps, Calm) so the panel never scrolls.
    details: >-
      Summary holds a translucent route-at-a-glance bar with the worst bump ringed and the timeline's
      cursor mirrored, the basic flight data (distance, flight time, cruise, aircraft, ride when the
      type is known) and the offline and 3D actions. Bumps holds the category breakdown and each
      bumpy stretch in flight order (worst category, start and end, local clock time, length). Calm
      lists smooth windows of 20 minutes or more outside the first 20 and last 30 minutes, longest
      first, with the coverage notes and data sources as a footnote. Clicking a stretch or window
      puts the timeline and map cursor on it. All panes share one cell so the pass keeps the tallest
      pane's height and the map doesn't jump between tabs.
    source:
      text: >-
        I like boarding pass but 1. not sure why we have a barcode in summary 2. basic flight data
        should be in summary 3. route at a glance looks a little too in your face, maybe add a bit
        of transparency? / also the "data" bit is kinda useless? can we show better data?
      reference: >-
        Giulio, turbol project thread, 2026-10-12, picking design 3 of five tabbed verdict panel
        alternatives ("tabs no scroll, also too flat -give me 5 alternative designs")
  - id: timeline-readout
    description: >-
      Hovering over or dragging along the turbulence timeline (category bar or EDR and altitude chart)
      reads out the point under the cursor: time into the flight, local clock time, time left, category,
      EDR and flight level, with a matching marker on the route map.
    details: >-
      A mouse leaving the chart clears the reading; a finger lifting off leaves it in place. Vertical
      swipes still scroll the page on phones. The downloaded-flight card's timeline reads the same way.
    source:
      text: >-
        there should be a way to drag or hover to read edc and time elapsed so I can get a sense of how
        intense during what part of the flight
      reference: Giulio, turbol project thread, 2026-10-12, on the Analyze page's turbulence timeline
  - id: coverage-notes
    description: >-
      The result says how much of the route uses the coarser global layer outside GTG coverage, and
      when data is missing it says why: part of the route has no data in either layer, the flight
      runs past the forecast's horizon, data is still loading, or the departure is more than 18 hours
      away. The data sources line names the global layer's GFS cycle.
    details: >-
      After a server update the GTG forecast and the global layer fill in hour by hour for a few
      minutes. Until each is in, gaps are blamed on loading rather than on missing coverage, and the
      page analyzes again a minute later.
