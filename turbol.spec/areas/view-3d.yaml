id: view-3d
name: 3D view
prose: >-
  The turbulence volume in 3D, with aircraft at their altitude. It lives in the live map's 3D mode;
  there is no separate 3D page.
behaviors:
  - id: volume-voxels
    description: >-
      3D draws a loaded frame's turbulence by category, stacking vertically adjacent cells of the same
      category at a grid point into one column whose tooltip gives its level range and worst EDR.
      Outside GTG the global layer is drawn in visibly larger 1.5 degree blocks.
  - id: true-heights
    description: >-
      A given altitude is drawn at the same height at every latitude, so coarse blocks far north never
      look taller than higher fine ones. Web Mercator draws heights 1/cos(latitude) taller, as it does
      widths, so 3D undoes that factor for every height (blocks, planes, the level outline); widths
      keep the map's stretch.
    source:
      text: >-
        fl370 on lower resolution looks taller than fl450 on higher resolution - I understand it's
        because of size of block to indicate lower resolution but feels weird
  - id: all-levels
    description: >-
      Every flight level can be shown at once: the flight-level rail's full range is "All levels",
      and light turbulence can be hidden.
    source:
      text: I should be able to see all flight levels
  - id: loads-on-demand
    description: >-
      The 3D library loads only when 3D is first opened, or ahead of time while the live map is idle
      on a good connection, keeping other pages light.
  - id: loads-without-freezing
    description: >-
      Opening 3D never freezes the page: the volume downloads and is prepared off the main thread,
      progress is shown, and columns nearest the camera appear first.
    source:
      text: >-
        also first load takes forever (it's good we're caching and it's amazingly fast afterwards,
        but incremental and smooth loading would be great instead of freezing the page)
  - id: no-separate-page
    description: >-
      There is no 3D tab. Old /3d links, and the 3D buttons in aircraft popups and Analyze, open the
      live map in 3D with that flight added.
    source:
      text: >-
        since we have 3d view in live map, no need for dedicated tab (but we should borrow the
        "vertical" FL control)
  - id: operable-in-3s
    description: >-
      3D loads and is operable within 3 seconds: the map, the turbulence columns for the shown levels,
      and pan, tilt and rotate. The volume comes as compact binary, compressed once when a frame is
      built (the opening frame ahead of time), and the live map fetches it while 2D is up. To keep it
      small, 3D EDR values are rounded down to 0.01 (implementation choice, not a user decision); the
      Medium thresholds are whole hundredths, so no column changes category.
    source:
      text: 3d view loads and is operable within 3 seconds
