id: view-3d
name: 3D view
prose: >-
  The turbulence volume in 3D, with aircraft at their altitude. It lives in the live map's 3D mode;
  there is no separate 3D page.
behaviors:
  - id: volume-voxels
    description: >-
      3D draws a loaded frame's turbulence by category, stacking vertically adjacent cells of the same
      category at a grid point into one column whose tooltip gives its level range and worst EDR.
      Outside GTG the global layer is drawn in visibly larger 1.5 degree blocks.
  - id: true-heights
    description: >-
      A given altitude is drawn at the same height at every latitude, so coarse blocks far north never
      look taller than higher fine ones. Web Mercator draws heights 1/cos(latitude) taller, as it does
      widths, so 3D undoes that factor for every height (blocks, planes, the level outline); widths
      keep the map's stretch.
    source:
      text: >-
        fl370 on lower resolution looks taller than fl450 on higher resolution - I understand it's
        because of size of block to indicate lower resolution but feels weird
  - id: level-under-pointer
    description: >-
      Hovering a stacked column names the single level under the pointer and that level's own EDR,
      above the column's range and worst EDR, so the data's native 1,000 ft levels stay readable
      without drawing a block per level.
    source:
      text: can we get more granualr with flight levels with GTG and GTGN?
  - id: all-levels
    description: >-
      Every flight level can be shown at once: the flight-level rail's full range is "All levels",
      and light turbulence can be hidden.
    source:
      text: I should be able to see all flight levels
  - id: loads-on-demand
    description: >-
      The 3D library loads only when 3D is first opened, or ahead of time while the live map is idle
      on a good connection, keeping other pages light.
  - id: loads-without-freezing
    description: >-
      Opening 3D never freezes the page: the volume downloads and is prepared off the main thread,
      progress is shown, and columns nearest the camera appear first.
    source:
      text: >-
        also first load takes forever (it's good we're caching and it's amazingly fast afterwards,
        but incremental and smooth loading would be great instead of freezing the page)
  - id: no-separate-page
    description: >-
      There is no 3D tab. Old /3d links, and the 3D buttons in aircraft popups and Analyze, open the
      live map in 3D with that flight added.
    source:
      text: >-
        since we have 3d view in live map, no need for dedicated tab (but we should borrow the
        "vertical" FL control)
  - id: operable-in-3s
    description: >-
      3D loads and is operable within 3 seconds: the map, the turbulence columns for the shown levels,
      and pan, tilt and rotate. The volume comes as compact binary, compressed once when a frame is
      built (the opening frame ahead of time), and the live map fetches it while 2D is up. To keep it
      small, 3D EDR values are rounded down to 0.01 (implementation choice, not a user decision); the
      Medium thresholds are whole hundredths, so no column changes category.
    source:
      text: 3d view loads and is operable within 3 seconds
  - id: flight-corridor
    description: >-
      With an analyzed route on, 3D shows only the air around the flight instead of the frame's
      blocks: 6,000 ft above and below its altitude in 1,000 ft levels and 60 km either side of
      its track in 15 km steps, sampled when the flight passes each point and classified for its
      aircraft, the same way as the route. A switch in the 3D panel goes back to the whole layer.
    details: >-
      Light-or-worse cells are drawn as boxes turned to the track; the cells the flight flies
      through are bright and the rest faint, and the line is colored by the cell it is in, so it
      always matches the boxes around it. Hovering a cell names its level, time, distance from the
      plan and category. The 6,000 ft and 60 km extents and 15 km steps are defaults chosen by
      Claude (one GTG level and about one GTG block per step), not user decisions.
    source:
      text: >-
        when focusing on a single flight we should have a view of turbulence focused on turbulence
        above and below and around the flight path
      reference: Giulio, turbol project thread, 2026-10-13
  - id: flight-what-if
    description: >-
      Sliders try the flight up to 6,000 ft higher or lower and up to 60 km left or right of its
      track; the line moves and recolors through the corridor, the planned path stays faintly
      visible, and the minutes at Moderate or worse are compared with the plan. A button applies
      the smoothest nearby option (fewest minutes at Moderate or worse, then at Light, then the
      smallest change).
    details: >-
      A change eases in over the first 300 km after takeoff and out over the last 300 km before
      landing (Claude's default), so the flight still leaves and reaches its airports and a detour
      bends away and back. The same sliders are on Analyze, and "Explore in 3D" carries the tried
      flight over.
    source:
      text: >-
        it would be good to have some ux to make it easier to see intersections as well as
        experiment with what the turbulence would look like if flight were to go higher or lower or
        take slight detour.
      reference: Giulio, turbol project thread, 2026-10-13
  - id: flight-projections
    description: >-
      Next to the flight in 3D and on the Analyze page, two flat views of the corridor share the
      timeline's cursor: a side view (time along the route against altitude, with the levels above
      and below) and a top view (time against distance either side of the track, at the flight's
      level), with the planned and tried flight drawn through them.
    details: >-
      Hovering the route in 3D, the timeline or either view moves the same cursor; in 3D a marker
      shows where the flight is at that minute. On phones the views sit in the 3D settings sheet.
    source:
      text: >-
        tangentially, in the analysis view it would be good to pair 3d views to 2s projections of 3d
        position of plane wrt to turbulence
      reference: Giulio, turbol project thread, 2026-10-13
