id: deployment
name: Run and deploy
prose: >-
  One Docker service plus Postgres. In the container nginx serves the built frontend and passes /api
  to the backend, so the app's files never wait on the JVM.
behaviors:
  - id: run-locally
    description: '`./run.sh` starts Postgres, the backend and the frontend for local use.'
  - id: render-free-plan
    description: >-
      The app deploys to Render's free plan from render.yaml and fits in 512 MB with every 3D frame
      loaded. Pushes to develop redeploy.
  - id: keep-awake-on-render
    description: >-
      On Render the backend pings its own public URL so the free instance does not sleep between
      nowcasts.
  - id: ci-disabled
    description: >-
      GitHub Actions workflows run only on manual dispatch; no push or PR triggers CI, and merges
      never wait on CI.
    source:
      text: never wait on ci - in fact, disable ci
  - id: every-view-load-time
    description: >-
      Every view (live map in 2D and 3D, a followed flight, Analyze's start page, a flight and a
      route) shows useful, interactive UI within 1 s and all of its data within 6 s, on cold and warm
      loads.
    source:
      text: every view's initial load is < 1second, full load < 6 seconds
  - id: static-files-off-jvm
    description: >-
      nginx in the container serves the frontend's files (precompressed) and proxies /api to the
      backend, unbuffered so server-sent events and streamed bodies pass straight through.
