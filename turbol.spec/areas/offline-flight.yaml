id: offline-flight
name: Flying with a bad connection
prose: >-
  Keep a passenger's own flight useful when the network isn't: offline from boarding until the plane
  is in the air, and slow, filtered or spotty Wi-Fi once it is. The design doc "Turbol Offline Flight
  Mode" (https://claude.ai/artifact/2BbUK1y6ZyxyBei4rdNmHS) lays out the approach. Decided: Giulio
  chose to build the offline Fly view first, answering "Offline Fly" to "Build which first: the
  offline Fly view or the best-flight Plan flow?" (decision card, Offline and low-bandwidth UX design
  thread, 2026-10-12 00:44Z). Its first phase is a Flight Pack of raw EDR for the flight's corridor,
  downloaded at the gate (the backend serves it at /api/packs/manifest and /api/packs/slab, and
  /api/ping tells a working connection from a captive portal), an app shell that opens with no
  network, the backend's sampler and route analyzer ported to the phone, and a page per saved flight
  that follows it from the gate to landing. That page started as its own Fly tab (/fly). Giulio then
  asked "do we need a dedicated view for offline or could we do like with google maps where you can
  download offline maps" (turbol project chat, 2026-10-12 04:56Z), and the tab was folded into the
  existing pages: Download for offline on an Analyze result or on a flight followed on the live map,
  a Downloaded for offline list at the top of Analyze, and each downloaded flight's page at
  /analyze?flight=<id>, with /fly redirecting there. That layout is the current design, not a
  decision of Giulio's: he asked the question, and Claude recommended folding the tab in and built
  it (Offline and low-bandwidth UX design thread, 2026-10-12 05:03Z). Still
  proposals, not decided: a position engine that also takes an ADS-B fix whenever a Wi-Fi window
  opens, one small request per window, and splitting the app into two flows, Plan (ahead of time,
  including finding the best flight for a route) and Fly (the day of and during the flight). Giulio
  floated both flows ("Maybe we need two clear separate flows", "what would be cool there is
  specfically trying to find best flight for a given route") without deciding them, so they are not
  behaviors yet. Background prefetching would follow the same good-connection and supersession rule
  as live-map/smooth-forecast-scrub. The proposal replaces Follow's event stream with short requests
  while in the air and keeps the 10-second refresh on the phone, so adopting it would mean
  revisiting follow-flight/follow-updates-every-ten-seconds.
behaviors:
  - id: usable-from-gate-until-airborne
    description: >-
      A flight looked up at the airport can still be opened and followed after boarding with no
      connection at all, until the plane is in the air.
    details: >-
      Download for offline, under an Analyze result or on a flight followed on the live map, saves the
      flight and downloads its Flight Pack into the phone's IndexedDB. Analyze lists the downloaded
      flights at the top with where each download stands, its size and when it was last updated, and a
      way to remove it. With no connection the flight's page (/analyze?flight=<id>) opens from the app
      shell and shows the flight's verdict, timeline and turbulence profile worked out on the phone
      from that pack, at the gate and in the air. A flight downloaded from the live map gets a
      departure worked back from where the plane is, since ADS-B carries no schedule. For a few minutes
      after the server starts (every deploy), it holds only part of the turbulence data, so until it has
      checked each source once the manifest says it is still loading instead of handing out a partial
      pack. The phone then shows "Downloading soon", keeps any pack it already has, and asks again
      until the whole pack is there. Production showed why on 2026-10-12: for about 7 minutes after each
      deploy, packs came back empty or partial while the app said "Ready offline". Implementation
      choices, not requirements: the HTTP 503 answer, the 30-second retry, and placing the list and the
      flight's page in Analyze.
    source:
      text: >-
        You are at the airport, open the site, look up your flight, but then board the plane and you
        don't have connection till when you're up in the air
      reference: Giulio, turbol project chat, 2026-10-11 22:39Z (Offline and low-bandwidth UX design)
  - id: updates-in-short-windows
    description: >-
      In the air on slow, filtered or spotty Wi-Fi, the app takes each chance it gets to download
      updates for the flight and stays usable between them.
    details: >-
      While Turbol is open, on any page, it asks for a newer pack for each downloaded flight, one at a
      time and the one in the air first: when the connection comes back, when the app comes to the
      front, and on a timer, first checking /api/ping so a captive portal counts as no connection. A
      newer pack downloads beside the one in use, slab by slab with the nowcast first, so a window that
      closes keeps what arrived, and the flight switches to it only once every slab is on the phone.
      While a downloaded flight is in the air the phone also keeps the app build it has, so plane Wi-Fi
      goes to the flight's turbulence. Implementation choices, not requirements: the timer (3 minutes
      in the air, 10 on the ground, backing off after failures), the download order, and holding app
      updates until after landing.
    source:
      text: >-
        You're in the air and have wifi connection but it's slow-af, might be occasionally filter out
        by the plane router, and it may be quite spotty, so you only get a chance every now and then to
        download updates
      reference: Giulio, turbol project chat, 2026-10-11 22:39Z (Offline and low-bandwidth UX design)
  - id: position-keeps-updating-offline
    description: >-
      Between downloads, the flight's position keeps updating from the phone itself, for example from
      GPS or dead reckoning.
    details: >-
      Without GPS the flight's page flies the planned route and climb, cruise and descent profile from
      the takeoff: GPS on the takeoff run, the passenger's "We've taken off" tap, or else the scheduled
      departure plus a taxi. With GPS on, the latest fix at flying speed pins where the plane is on
      that plan, and one in cruise also sets the pace of the rest of the flight from its ground speed,
      so a tailwind brings what's ahead sooner. A flight downloaded from the live map starts from the
      plane's tracked position the same way, and says "Tracked" rather than "GPS". The view says how sure it is in minutes and shades that
      stretch of the timeline. Assumptions, not requirements: a 15-minute taxi; 50 m/s as the speed
      that means airborne; fixes faster than 400 m/s, vaguer than 1 km or 600 km off the route ignored
      as bad readings; and the timing-error tables (90th percentile) behind the plus-or-minus minutes.
    source:
      text: should still be able to use gps / dead reconing / inertia /... to keep updating your flight
      reference: Giulio, turbol project chat, 2026-10-11 22:39Z (Offline and low-bandwidth UX design)
  - id: opens-with-no-connection
    description: >-
      Once Turbol has been opened with a connection, it opens again with none (airplane mode, a
      captive portal, a dead or crawling link) and shows the app, not the browser's offline page.
    details: >-
      The offline app shell from the first phase Giulio picked. Opened with no connection, Turbol goes
      straight to the downloaded flight in the air or leaving next instead of the live map, which needs
      the network. When the connection works, opening the app still gets the latest deploy (if the
      server takes more than a second to send the page, that open uses the copy on the phone so the map
      shows at once, per live-map/load-time-goal, and the deploy shows up on a later open), except
      while a downloaded flight is in the air (see updates-in-short-windows): then it opens the build
      on the phone and updates after landing. Implementation choice, not a requirement: opening that
      flight while it is in the air even with a connection, so slow plane Wi-Fi isn't spent on the
      live map.
    source:
      text: Offline Fly
      reference: >-
        Giulio's answer on the decision card "Build which first: the offline Fly view or the
        best-flight Plan flow?", whose Offline Fly option read "Four PRs: Flight Pack at the gate,
        offline app shell, on-phone sampler, Fly view.", Offline and low-bandwidth UX design
        thread, 2026-10-12 00:44Z
  - id: download-covers-reroutes-and-climbs
    description: >-
      A downloaded flight carries turbulence for a 3D slice along its expected path, wide enough to
      still have data if the flight is rerouted a bit, and at every altitude it may climb or descend
      through.
    details: >-
      The Flight Pack covers 240 km either side of the planned great-circle route, at 12 levels from
      3,000 to 41,000 ft, each forecast hour cut to where the plane can be at that time. JFK to LAX
      came to 15 frames and 5 MB on the phone in production on 2026-10-12. Implementation choices,
      not requirements: the 240 km, the 12 levels and the per-hour cut.
    source:
      text: >-
        turbulence data for a given slice that is along the expected path of the flight (but wide
        enough to have data in case flight is rerouted a bit and definitely having 3d data for
        altitude changes)
      reference: Giulio, turbol project chat, 2026-10-12 04:56Z
