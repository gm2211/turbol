id: turbulence-data
name: Turbulence data
prose: >-
  Turbulence comes from NOAA's free NOMADS feeds over HTTPS: the GTGN nowcast (every 15 minutes) and
  the GTG v4 forecast (hourly cycles, F000 to F018). Both are EDR on the 3 km HRRR Lambert grid and
  cover the contiguous US only. Everywhere else a coarse global layer fills in: the World Area
  Forecast System (WAFS) turbulence forecast blended with an index derived from NOAA GFS winds
  (data-pipeline/gfs_turbulence.py and wafs_blend.py have the method and its verification). Gridded
  WAFS GRIB needs an approved WIFS account, so the WAFS values are read from the public images the
  Aviation Weather Center publishes for its WAFS viewer.
behaviors:
  - id: nowcast-picked-up-quickly
    description: >-
      Each new 15-minute GTGN nowcast is loaded within about a minute of appearing on NOMADS. A file
      still being uploaded that does not decode completely is skipped in favour of the previous one.
  - id: forecast-fetches-only-needed-levels
    description: >-
      GTG forecasts are fetched with byte-range requests for only the EDR messages and altitude levels
      the app uses, never the whole multi-hundred-MB files. Both GTGN and GTG carry 51 levels (100 ft,
      then every 1,000 ft to 50,000 ft); the nowcast keeps all of them, the forecast keeps every
      1,000 ft from FL300 to FL450 plus 3,000, 6,000, 10,000, 15,000, 20,000 and 25,000 ft (the
      level choice is an implementation default, not a user decision).
    source:
      text: can we get more granualr with flight levels with GTG and GTGN?
  - id: forecast-usable-while-loading
    description: >-
      On a first run the forecast is published hour by hour, so route analysis works before the whole
      cycle has downloaded. A long forecast download never delays the next nowcast.
  - id: cached-data-survives-restart
    description: >-
      On startup the newest complete nowcast and forecast left on disk are loaded before any new
      download, so a restart does not leave the app without data.
  - id: nowcast-blended-into-first-hour
    description: >-
      A point query uses the nowcast at full weight up to its valid time, tapering to zero one hour
      later, and the forecast interpolated in time between the two bracketing forecast hours.
  - id: status-lists-loaded-frames
    description: >-
      The turbulence status reports the loaded nowcast and forecast frames with their valid and issue
      times and levels, the thresholds per aircraft class, the GTG coverage bounding box and exact
      outline, and the global layer's source, resolution, GFS cycle and valid times.
  - id: outside-coverage-is-no-data
    description: >-
      A point where neither GTG nor the global layer has a value (for example before the global layer
      has loaded, or more than 3 hours past its last frame) reports no EDR and the NoData category
      rather than a guessed value.
    details: >-
      Before the global layer, everything outside the GTG grid was NoData; Giulio asked for at least
      transatlantic coverage, so the global layer now answers there.
    source:
      text: can we add at least transatlantic coverage?
      reference: Giulio, turbol project chat, 2026-10-12 00:18Z (Transatlantic turbulence coverage)
  - id: global-layer-outside-gtg
    description: >-
      Outside the GTG grid, or where GTG has no value, EDR comes from a global layer covering the
      whole world at GFS's 0.25 degree (about 28 km) resolution, at the same 12 altitude levels as the
      GTG forecast, every 3 hours from 3 to 48 hours after the GFS cycle (WAFS's own limit), interpolated in time,
      so a long-haul flight leaving tomorrow evening is covered gate to gate. Its
      source is reported as Global.
    source:
      text: can we add at least transatlantic coverage?
      reference: Giulio, turbol project chat, 2026-10-12 00:18Z (Transatlantic turbulence coverage)
  - id: global-layer-matches-gtg
    description: >-
      The global layer is Ellrod's TI1 turbulence index (vertical wind shear times horizontal
      deformation) from GFS winds and heights, mapped to EDR per level by matching GTG's EDR
      distribution over the US, so the same thresholds give about the same share of each category.
    details: >-
      Fitted on 4 GFS/GTG cycle pairs (6-hour forecasts) and scored against GTG on 4 later ones at
      FL200 and above: log correlation 0.54, Peirce skill 0.32 for Light or worse (0.40 on 75 km
      neighbourhoods), and 21% of points Light or worse vs GTG's 22%. TI1 beat the Ellrod-Knox and
      Richardson-number indices and their mean.
  - id: global-layer-uses-wafs
    description: >-
      From FL140 up, the global layer blends WAFS turbulence (80%) with the GFS index (20%), mapped
      to EDR by matching GTG over the US like the GFS index alone. WAFS comes from AWC's public WAFS
      viewer images (8 levels FL140 to FL450, read on the 0.25 degree grid). Below FL140, or when no
      WAFS cycle covers an hour, the GFS index is used alone. The status reports the WAFS cycle.
    details: >-
      WAFS images are colour-ramp PNGs (900x600 Mercator, about 0.4 degree, clear below about EDR
      0.1); each colour step maps to an EDR fitted against GTG. Scored like the GFS index on the
      same 4 later cycles at FL200 and above: log correlation 0.63 (GFS alone 0.54), Peirce skill
      0.47 for Light or worse (0.32) and 0.35 for Moderate or worse (0.23), 22.6% of points Light or
      worse vs GTG's 22.1%. For each GFS hour the newest WAFS cycle that has it (6 to 48 hours ahead)
      is used.
    source:
      text: I see WAFS without any registration
      reference: Giulio, Transatlantic turbulence coverage thread, 2026-10-12 01:03Z
  - id: global-blend-at-gtg-edge
    description: >-
      Across the last 40 grid cells (120 km) inside GTG's edge, GTG and the global layer are mixed
      linearly by distance to the edge, in point queries and map tiles alike, so there is no seam.
  - id: global-layer-refresh
    description: >-
      A new GFS cycle is fetched within about 10 minutes of its 48-hour forecast appearing on NOMADS,
      through the NOMADS GRIB filter (only the winds and heights it needs), is published hour by hour
      on a first run, and is kept on disk so a restart loads it before downloading again.
  - id: global-layer-switch
    description: >-
      TURBOL_GLOBAL_LAYER=off skips the global layer entirely (no GFS or WAFS downloads), and Flight Packs
      still count it as loaded so they don't wait for it; any other value, or none, keeps it on. The Docker
      image sets it on.
    details: >-
      An emergency switch for a small instance (#64), added while the 512 MB Render instance ran out of memory
      in the global layer's first refresh; on again since decodes were serialized and caches capped (#66, #67).
