id: follow-flight
name: Follow a flight
prose: >-
  Follow one aircraft in flight and see what is coming up for it, in passenger terms. Following
  happens on the live map; there is no separate Follow page.
behaviors:
  - id: follow-on-live-map
    description: >-
      Adding a flight on the live map, tapping its chip, or choosing Follow in an aircraft's popup
      follows that flight on the live map. The followed flight is kept in the page URL, and old
      /follow/<aircraft> links open the live map with that flight followed. The nav has no Follow tab.
    source:
      text: >-
        give me a few more designs for this page - it does not look professional / what's the
        difference? Also if I just wanna follow on the map, should I not just use the map
    details: >-
      Giulio picked "Merge into map" on the decision card "Fold 'Follow a flight' into the live
      map?" (project chat, 2026-10-12).
  - id: follow-strip
    description: >-
      A followed flight gets a strip along the bottom of the map (a bottom sheet on phones) with how
      fresh the data is, origin-to-destination progress, turbulence right now with EDR, altitude and
      speed, the next-hour headline, a bar of the next 90 minutes (or the rest of the route), and the
      worst category in the next hour. Closing it stops following. The legend, and on phones the
      2D/3D toggle, are hidden while it is open.
    details: >-
      Chosen from three panel designs (flight strip, side card, flight sheet) published as the
      "Follow panel options" artifact.
  - id: follow-map-ribbon
    description: >-
      While following, the map shows the aircraft labelled, its trail so far, and the path ahead as
      a ribbon coloured by turbulence category. It centres on the aircraft, then only pans when the
      aircraft nears the edge, and switches the map altitude once to the level nearest the aircraft.
  - id: follow-updates-every-ten-seconds
    description: >-
      Following an aircraft streams an update about it every 10 seconds until following stops.
  - id: next-hour-headline
    description: >-
      Each update leads with a headline about the next hour, such as "Smooth now. Light bumps expected
      in about 12 min for about 5 min." or "Moderate turbulence right now."
  - id: route-only-if-heading-there
    description: >-
      The scheduled route is used for the rest of the flight only when the aircraft is actually
      heading for that destination.
  - id: no-data-outside-coverage
    description: >-
      Where neither GTG nor the global layer has data, the headline says there is no turbulence data
      here rather than calling the flight smooth.
  - id: follow-first-update-from-cache
    description: >-
      The first update for a followed flight starts from the live map's cached traffic when it saw
      the aircraft in the last 2 minutes (dead-reckoned to now), so it does not wait on adsb.lol;
      later updates ask adsb.lol and fall back to the cache when it fails.
  - id: follow-updates-delivered-promptly
    description: >-
      Each update on the followed flight's stream reaches the browser when it is sent, not held
      by a proxy until the next one: the stream is marked no-transform and each event is followed
      by a short comment that flushes it. Each update waits at most 2 s for adsb.lol, else goes on
      from the latest report it has (adsb.lol's last, or the map's traffic, dead-reckoned to now).
