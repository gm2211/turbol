<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/src/assets/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#10324f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turbol">
    <title>Turbol</title>
    <link rel="preconnect" href="https://server.arcgisonline.com">
    <script>
      // Opening the 2D live map: start loading the basemap and the latest turbulence for the view it opens on
      // (LiveMapView: US at zoom 5, FL350) now, so the tiles are already coming in when the app's code has loaded and
      // Leaflet asks for the same URLs. The map's size is the window's minus the nav and app bars (see base.css).
      if (/^\/(map\/?)?$/.test(location.pathname) && !/(^|[?&])(view|follow|flights)=/.test(location.search)) {
        (function () {
          var mobile = matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)').matches
          var left = mobile ? 4 : 0, top = mobile ? 52 : 64
          var w = innerWidth - (mobile ? 8 : 0), h = innerHeight - (mobile ? 112 : 64)
          var z = 5, scale = 256 * Math.pow(2, z)
          var cx = ((-97 + 180) / 360) * scale
          var s = Math.sin((39.5 * Math.PI) / 180)
          var cy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale
          var x0 = Math.floor((cx - w / 2) / 256), x1 = Math.floor((cx + w / 2) / 256)
          var y0 = Math.floor((cy - h / 2) / 256), y1 = Math.floor((cy + h / 2) / 256)
          var tiles = []
          for (var x = x0; x <= x1; x++) for (var y = y0; y <= y1; y++) tiles.push([x, y])
          // Centre first, like Leaflet: the server renders turbulence tiles two at a time.
          tiles.sort(function (a, b) {
            return Math.hypot(a[0] + 0.5 - cx / 256, a[1] + 0.5 - cy / 256) - Math.hypot(b[0] + 0.5 - cx / 256, b[1] + 0.5 - cy / 256)
          })
          // Leaflet's pixel origin for this view, so the preview below lines up with the map that replaces it.
          var ox = Math.round(cx - w / 2), oy = Math.round(cy - h / 2)
          window.__openingTiles = []
          tiles.forEach(function (t) {
            var base = new Image(), turb = new Image()
            base.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/' + z + '/' + t[1] + '/' + t[0]
            turb.src = '/api/turbulence/tiles/latest/35000/' + z + '/' + t[0] + '/' + t[1] + '.png'
            turb.style.opacity = '0.85'
            ;[base, turb].forEach(function (img) {
              img.alt = ''
              img.onerror = function () { img.remove() }
              img.style.position = 'absolute'
              img.style.left = t[0] * 256 - ox + 'px'
              img.style.top = t[1] * 256 - oy + 'px'
              img.style.width = img.style.height = '256px'
            })
            window.__openingTiles.push(base, turb)
          })
          // Until the app's code has loaded and Leaflet draws, show those tiles where the map will be, so the map is
          // there from the first paint. LiveMapView removes this once Leaflet's basemap has loaded.
          window.__mapPreview = function () {
            var preview = document.createElement('div')
            preview.id = 'map-preview'
            preview.setAttribute('aria-hidden', 'true')
            preview.style.cssText = 'position:fixed;overflow:hidden;pointer-events:none;z-index:2000;background:#e4e4e2;' +
              'border-radius:' + (mobile ? 8 : 0) + 'px;' +
              'left:' + left + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px'
            window.__openingTiles.forEach(function (img) { preview.appendChild(img) })
            document.body.appendChild(preview)
            setTimeout(function () { preview.remove() }, 15000)
          }
        })()
      }
    </script>
    <script>
      // Opening the map in 3D: start downloading the turbulence volume now, before the app's code has loaded
      // (prefetchVolume in src/api/turbulence.ts picks it up).
      if (/^\/(map|3d)/.test(location.pathname) && /(^|[?&])view=3d/.test(location.search) || location.pathname.startsWith('/3d')) {
        // The status too: 3D needs it (frame, thresholds) before it can draw.
        window.__status = fetch('/api/turbulence/status').then((r) => (r.ok ? r.json() : undefined)).catch(() => undefined)
        window.__openingVolume = fetch('/api/turbulence/volume/opening/bin2?step=6')
          .then((r) => (r.ok ? r.arrayBuffer().then((volume) => ({ id: r.headers.get('X-Frame-Id'), volume })) : undefined))
          .catch(() => undefined)
      }
    </script>
</head>
<body>
<div id="app"></div>
<script>
  if (window.__mapPreview) window.__mapPreview()
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
