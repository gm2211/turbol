<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/src/assets/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#10324f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turbol">
    <title>Turbol</title>
    <script>
      // Opening the map in 3D: start downloading the turbulence volume now, before the app's code has loaded
      // (prefetchVolume in src/api/turbulence.ts picks it up).
      if (/^\/(map|3d)/.test(location.pathname) && /(^|[?&])view=3d/.test(location.search) || location.pathname.startsWith('/3d'))
        window.__openingVolume = fetch('/api/turbulence/volume/opening/bin?step=6')
          .then((r) => (r.ok ? r.arrayBuffer().then((volume) => ({ id: r.headers.get('X-Frame-Id'), volume })) : undefined))
          .catch(() => undefined)
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
